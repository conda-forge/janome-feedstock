{% set name = "Janome" %}
{% set version = "0.5.1" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | lower }}-{{ version }}.tar.gz
  sha256: 9d58e6236f0f64adf13a5e8997c3b13d78103e951cd3594345a9ad9970569753

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling
  run:
    - python >={{ python_min }}

test:
  imports:
    - janome
    - janome.sysdic
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/mocobeta/janome
  summary: Japanese morphological analysis engine.
  license: Apache-2.0
  license_file:
    - LICENSE.txt
    - NOTICE.txt
  doc_url: https://mocobeta.github.io/janome/en/
  dev_url: https://github.com/mocobeta/janome/wiki#for-contributors

extra:
  recipe-maintainers:
    - BastianZim
